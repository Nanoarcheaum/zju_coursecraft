<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="课构 CourseCraft：在浏览器本地导入课程包与培养方案映射，积木式规划大学课表。"><title>课构 CourseCraft · 本地课程规划器</title><link rel="stylesheet" href="future-planner.css"><style>html,body{margin:0;min-width:320px}.standalone-toast{position:fixed;z-index:90;left:50%;bottom:25px;transform:translate(-50%,15px);padding:11px 17px;border-radius:10px;background:#203b33;color:white;opacity:0;transition:.2s;pointer-events:none;font:12px 'Segoe UI','Microsoft YaHei',sans-serif}.standalone-toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main id="planner"></main><div id="toast" class="standalone-toast"></div><script src="jszip.min.js"></script><script src="xlsx-import.js"></script><script src="future-planner.js"></script><script src="initial-plan.js"></script><script>(function(){const key='future-course-planner.v2',notice=document.querySelector('#toast');let timer;function toast(text){notice.textContent=text;notice.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>notice.classList.remove('show'),4200)}let state=null;try{const saved=localStorage.getItem(key);if(saved)state=JSON.parse(saved)}catch{}FuturePlanner.mount({root:document.querySelector('#planner'),standalone:true,initialState:state,defaultState:window.INITIAL_FUTURE_PLAN,xlsxReader:file=>IHomeXlsx.read(file),toast,onSave:s=>localStorage.setItem(key,JSON.stringify(s)),onBack:()=>toast('独立版已经在规划主页'),onActivate:()=>toast('独立版已记录规划；在 i-home 中可应用到周课表。')});})();</script></body></html>
